# Local MySQL for development: `docker compose up -d`
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tiktok_dash
      MYSQL_USER: dash
      MYSQL_PASSWORD: dashpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
